name: Refresh LOC report

on:
  schedule:
    - cron: "0 9 * * 1"  # Mondays 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out profile repo
        uses: actions/checkout@v4

      - name: Check out scripts repo (private, read-only PAT)
        uses: actions/checkout@v4
        with:
          repository: dcltdw/scripts
          token: ${{ secrets.SCRIPTS_READ_TOKEN }}
          path: scripts-repo

      - name: Shallow-clone the public repos
        run: |
          mkdir -p /tmp/repos
          for r in annotated-maps-sp Flightdeck Understated bunnyforge agents gtfs-demo; do
            git clone --depth=1 "https://github.com/dcltdw/$r.git" "/tmp/repos/$r"
          done

      - name: Refresh the README block
        run: |
          python3 scripts-repo/loc_report.py --md \
            /tmp/repos/annotated-maps-sp /tmp/repos/Flightdeck /tmp/repos/Understated \
            /tmp/repos/bunnyforge /tmp/repos/agents /tmp/repos/gtfs-demo \
            | python3 .github/scripts/update_loc_report.py

      - name: Commit and push
        run: |
          if git diff --quiet README.md; then
            echo "README unchanged; nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh LOC report"
          git push
