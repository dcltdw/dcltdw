name: Refresh LOC report

on:
  schedule:
    - cron: "0 9 * * 1"  # Mondays 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: loc-report
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      REPOS: "annotated-maps-sp Flightdeck Understated bunnyforge agents gtfs-demo bunnyarchives kotlin-ramp-up"
    steps:
      - name: Check out profile repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Fine-grained PAT, resource owner dcltdw, repository access limited to
      # dcltdw/scripts only, permissions Contents = Read-only. Renewal is an
      # annual chore; this step failing is the renewal signal.
      - name: Check out scripts repo (private, read-only PAT)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: dcltdw/scripts
          token: ${{ secrets.SCRIPTS_READ_TOKEN }}
          path: scripts-repo
          persist-credentials: false

      - name: Shallow-clone the public repos
        run: |
          mkdir -p /tmp/repos
          for r in $REPOS; do
            git clone --depth=1 "https://github.com/dcltdw/$r.git" "/tmp/repos/$r"
          done

      - name: Test the splice script
        run: python3 .github/scripts/test_update_loc_report.py

      - name: Refresh the README block
        run: |
          paths=(); for r in $REPOS; do paths+=("/tmp/repos/$r"); done
          python3 scripts-repo/loc_report.py --md "${paths[@]}" \
            | python3 .github/scripts/update_loc_report.py

      - name: Commit and push
        run: |
          if git diff --quiet README.md; then
            echo "README unchanged; nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh LOC report"
          git push
